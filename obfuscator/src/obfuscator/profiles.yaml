# Annotator + model noise profiles for the layered generation pipeline.
# Rates = per-field probability of disagreement vs. the report_realization layer.

annotators:
  gold:
    rate: 0.05
    bias: none
  nhc_without_preann:
    rate: 0.10
    bias: none
  nhc_with_preann:
    rate: 0.08
    bias: preann_anchor
    preann_follow_prob: 0.30
  kpc_without_preann:
    rate: 0.10
    bias: none
  kpc_with_preann:
    rate: 0.08
    bias: preann_anchor
    preann_follow_prob: 0.30

# Per-model accuracy (1 - per-field error rate). Used by Layer 3 (predictions).
models:
  gpt_oss_20b:    {rate: 0.15, family: llm}
  gemma4_30b:     {rate: 0.20, family: llm}
  gemma4_e2b:     {rate: 0.30, family: llm}
  gemma4_26b:     {rate: 0.20, family: llm}
  qwen3_30b:      {rate: 0.20, family: llm}
  medgemma_27b:   {rate: 0.15, family: llm}
  medgemmasmall:  {rate: 0.30, family: llm}
  clinicalbert_v1_baseline: {rate: 0.30, family: clinicalbert}
  clinicalbert_v2_finetuned: {rate: 0.18, family: clinicalbert}
  rule_based:     {rate: 0.35, family: rule_based}

# Layer 1 (report_realization) parameters.
realization:
  drop_rate: 0.10        # ~10% of optional fields not mentioned in text
  ambiguity_rate: 0.05   # ~5% of fields rendered ambiguously

# Per-field plausible numeric ranges for Layer 0 (canonical).
# Used to constrain jsf-style randomization to clinically-plausible values.
numeric_ranges:
  tumor_size:        {lo: 3, hi: 120, sigma_pct: 0.20}
  dcis_size:         {lo: 1, hi: 80,  sigma_pct: 0.25}
  distance:          {lo: 0, hi: 50,  sigma_pct: 0.30}
  involved:          {lo: 0, hi: 30,  sigma_pct: 0.40}
  examined:          {lo: 1, hi: 50,  sigma_pct: 0.30}
  percentage:        {lo: 0, hi: 100, sigma_pct: 0.20}
  maximal_ln_size:   {lo: 1, hi: 60,  sigma_pct: 0.25}
  ajcc_version:      {lo: 7, hi: 8,   sigma_pct: 0.0}

# Per-field "near-neighbor" enum confusion tables — clinically plausible
# misclassifications. Defaults to uniform-random fallback.
near_neighbors:
  pt_category:
    tx:    [tis, t1mi]
    tis:   [t1mi, t1a]
    t1mi:  [tis, t1a]
    t1a:   [t1mi, t1b]
    t1b:   [t1a, t1c]
    t1c:   [t1b, t2]
    t2:    [t1c, t3]
    t3:    [t2, t4a]
    t4a:   [t3, t4b]
    t4b:   [t4a, t4c]
    t4c:   [t4b, t4a]
  pn_category:
    nx:    [n0]
    n0:    [n1mi, nx]
    n1mi:  [n0, n1a]
    n1a:   [n1mi, n1b]
    n1b:   [n1a, n1c]
    n1c:   [n1b, n2a]
    n2a:   [n1c, n2b]
    n2b:   [n2a, n3a]
    n3a:   [n2b, n3b]
    n3b:   [n3a, n3c]
    n3c:   [n3b, n3a]
  pm_category:
    mx:    [m0]
    m0:    [mx, m1]
    m1:    [m0, mx]
  grade:
    1: [2]
    2: [1, 3]
    3: [2]
  nuclear_grade:
    1: [2]
    2: [1, 3]
    3: [2]
  tubule_formation:
    1: [2]
    2: [1, 3]
    3: [2]
  mitotic_rate:
    1: [2]
    2: [1, 3]
    3: [2]

# Cancer-type prevalence used when generating "is this a cancer report" decisions.
# 80% cancer / 20% non-cancer matches the dummy README's defaults.
cancer_excision_rate: 0.80
