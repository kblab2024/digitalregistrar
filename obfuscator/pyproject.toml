[project]
name = "obfuscator"
version = "0.1.0"
description = "Schema-conformant workspace obfuscator for the Digital Registrar pipeline. Produces workspace_obfustrated/ from workspace/ so Claude can debug eval pipelines without touching PHI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema",
  "pyyaml",
]

[project.scripts]
obfuscate-workspace = "obfuscator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"obfuscator" = ["profiles.yaml", "templates/*.txt"]
