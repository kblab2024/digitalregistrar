[project]
name = "drr-attic"
version = "0.2.0"
description = "Archived research scaffolding for the Digital Registrar — benchmarks, ablations, baselines, obfuscator. Not maintained; install only if you need to reproduce paper-time experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
authors = [
  { name = "Digital Registrar contributors" },
]
classifiers = [
  "Development Status :: 6 - Mature",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "digital-registrar",
  "scikit-learn",
  "torch",
  "transformers",
  "openai",
  "matplotlib",
  "seaborn",
  "scipy",
  "statsmodels",
  "jsonschema",
  "pyyaml",
  "regex",
]

[project.scripts]
registrar-benchmark = "drr_attic.benchmarks.eval.run_all:main"
registrar-ablate = "drr_attic.ablations.eval.run_ablations:main"
obfuscate-workspace = "obfuscator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
[tool.setuptools.packages.find]
where = ["src", "obfuscator/src"]
