name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core (digital-registrar) + dev tools
        run: pip install -e ".[dev]"
      - name: Install apps
        run: |
          pip install -e apps/infer-gui
          pip install -e apps/schema-editor
          pip install -e apps/annotator
      - name: Lint
        run: ruff check src apps tests
      - name: Test (core + app suites; attic excluded)
        run: pytest -q tests apps/annotator/tests
      - name: Schema concordance (Pydantic ↔ JSON)
        run: python -m digital_registrar.schemas.generate --check
