[project]
name = "digital-registrar-research"
version = "0.1.0"
description = "The Digital Registrar — research stack: pipeline, annotation, benchmarks, ablations"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Hong-Kai (Walther) Chen" },
  { name = "Po-Yen Tzeng" },
  { name = "Kai-Po Chang" },
]
keywords = ["cancer", "pathology", "registry", "nlp", "dspy", "clinical"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "dspy>=3.2",
  "pydantic>=2",
  "numpy",
  "pandas",
]

[project.optional-dependencies]
annotation  = ["streamlit>=1.35"]
benchmarks  = ["scikit-learn", "torch", "transformers", "openai", "regex", "matplotlib", "seaborn", "scipy", "statsmodels"]
ablations   = ["jsonschema", "openai", "scipy", "statsmodels", "pyyaml"]
schema-gui  = ["streamlit>=1.35", "pandas", "ruff"]
dev         = ["pytest>=8", "ruff", "mypy", "scipy", "statsmodels", "jsonschema", "pyyaml", "scikit-learn", "pyarrow"]
all         = ["digital-registrar-research[annotation,benchmarks,ablations,schema-gui,dev]"]

[project.scripts]
registrar-pipeline  = "digital_registrar_research.runner:main"
registrar-annotate  = "digital_registrar_research.annotation.app:main_cli"
registrar-annotate-workspace = "digital_registrar_research.annotation.app_canonical:main_cli_workspace"
registrar-annotate-dummy     = "digital_registrar_research.annotation.app_canonical:main_cli_dummy"
registrar-benchmark = "digital_registrar_research.benchmarks.eval.run_all:main"
registrar-ablate    = "digital_registrar_research.ablations.eval.run_ablations:main"
registrar-schemas   = "digital_registrar_research.schemas.generate:main"
registrar-schema-gui = "digital_registrar_research.schema_gui.app:main_cli"
registrar-infer-gui  = "digital_registrar_research.inference_gui.app:main_cli"

[project.urls]
Homepage = "https://github.com/kblab2024/digital-registrar-research"
"Slim release" = "https://github.com/kblab2024/digitalregistrar"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"digital_registrar_research.schemas" = ["data/*.json", "aliases/*.toml", "_templates/*.tmpl"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
