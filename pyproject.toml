[project]
name = "digital-registrar"
version = "0.2.0b4"
description = "The Digital Registrar — a schema-first framework for multi-cancer, privacy-preserving pathology abstraction via local LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Nan-Haw Chow" },
  { name = "Han Chang" },
  { name = "Hung-Kai Chen" },
  { name = "Chen-Yuan Lin" },
  { name = "Ying-Lung Liu" },
  { name = "Po-Yen Tseng" },
  { name = "Li-Ju Shiu" },
  { name = "Yen-Wei Chu" },
  { name = "Pau-Choo Chung" },
  { name = "Kai-Po Chang" },
]
keywords = ["cancer", "pathology", "registry", "nlp", "dspy", "clinical", "cap-aligned"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "dspy>=3.2",
  "pydantic>=2",
  "numpy",
  "pandas",
  "scipy",
  "tnmhelper",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "build", "twine", "pyarrow"]

[project.scripts]
registrar-pipeline = "digital_registrar.runner:main"
registrar-schemas = "digital_registrar.schemas.generate:main"
registrar-eval = "digital_registrar.eval.cli:main"

[project.urls]
Homepage = "https://github.com/kblab2024/digitalregistrar"
Paper = "https://doi.org/10.3390/diagnostics16111644"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"digital_registrar.schemas" = ["data/*.json", "aliases/*.toml", "_templates/*.tmpl"]
"digital_registrar.staging" = ["data/*.zip"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "apps/annotator/tests"]
pythonpath = ["src"]
# importlib avoids name collisions between tests/__init__.py and apps/*/tests/__init__.py
addopts = "--import-mode=importlib"
